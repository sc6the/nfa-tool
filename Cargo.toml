[package]
name = "nfa-loader"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "nfa"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
base64 = "0.22"
crc32fast = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_Foundation",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
